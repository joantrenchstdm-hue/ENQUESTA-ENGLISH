<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --navy: #0c1f44;
    --navy-2: #16306a;
    --orange: #d9480f;
    --orange-soft: #fff1e8;
    --bg: #f4f6fb;
    --surface: #ffffff;
    --ink: #0f1a33;
    --muted: #5b667f;
    --line: #dbe1ee;
    --track: #e6eaf4;
    --bar-other: #c3cde4;
    --display: "Sora", "Inter", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.55 var(--body);
    -webkit-font-smoothing: antialiased;
  }

  /* Header band with a faint basketball court drawn in lines */
  .hero {
    position: relative; overflow: hidden;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
    padding: 44px 16px 104px;
  }
  .court {
    position: absolute; inset: 0; width: 100%; height: 100%;
    fill: none; stroke: rgba(255,255,255,.13); stroke-width: 2;
    pointer-events: none;
  }
  .hero-in { position: relative; max-width: 680px; margin: 0 auto; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font: 600 .75rem var(--body); letter-spacing: .16em; text-transform: uppercase;
    color: #ffb48a; margin: 0 0 14px;
  }
  .eyebrow::before { content: ""; width: 26px; height: 3px; border-radius: 3px; background: var(--orange); }
  h1 { font: 800 clamp(2.1rem, 7vw, 3.1rem)/1.05 var(--display); letter-spacing: -0.03em; margin: 0 0 12px; }
  .sub { margin: 0; max-width: 46ch; color: #c9d4ee; font-size: 1.05rem; }

  main { max-width: 680px; margin: -64px auto 0; padding: 0 16px 64px; position: relative; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 2px 4px rgba(12,31,68,.05), 0 18px 40px rgba(12,31,68,.10);
    padding: 30px;
  }
  @media (max-width: 480px) { .card { padding: 22px 16px; } }

  .steps { display: flex; gap: 6px; margin-bottom: 14px; }
  .steps span { flex: 1; height: 5px; border-radius: 999px; background: var(--track); }
  .steps span.done { background: var(--navy); }
  .steps span.now { background: var(--orange); }
  .counter { font: 600 .8rem var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  h2 { font: 700 clamp(1.35rem, 4.5vw, 1.75rem)/1.25 var(--display); letter-spacing: -0.02em; margin: 0 0 22px; text-wrap: balance; }

  .options { display: grid; gap: 10px; }
  .option {
    display: flex; align-items: center; gap: 14px;
    width: 100%; text-align: left;
    background: var(--surface); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 13px 14px; font: 500 1.02rem/1.35 var(--body);
    cursor: pointer;
    transition: border-color .12s, background .12s, transform .12s;
  }
  .option .key {
    flex: none; width: 30px; height: 30px; display: grid; place-items: center;
    border-radius: 8px; background: var(--track); color: var(--navy);
    font: 700 .85rem var(--display);
    transition: background .12s, color .12s;
  }
  .option:hover { border-color: var(--navy); transform: translateY(-1px); }
  .option[aria-pressed="true"] { border-color: var(--navy); background: var(--orange-soft); box-shadow: inset 0 0 0 1px var(--navy); }
  .option[aria-pressed="true"] .key { background: var(--orange); color: #fff; }

  .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
  .btn {
    font: 600 .95rem var(--body); cursor: pointer;
    border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 24px;
    background: var(--surface); color: var(--navy);
    transition: background .12s, border-color .12s, transform .12s;
  }
  .btn:hover:not(:disabled) { border-color: var(--navy); }
  .btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #bf3f0a; border-color: #bf3f0a; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .option:focus-visible, .btn:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .error { margin-top: 14px; color: #b3261e; font-weight: 500; font-size: .95rem; }

  .res-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; padding-bottom: 18px; border-bottom: 2px solid var(--navy); }
  .res-head h2 { margin: 0; }
  .people { color: var(--muted); font-size: .9rem; font-weight: 600; }
  .rq { padding: 24px 0; border-bottom: 1px solid var(--line); }
  .rq:last-of-type { border-bottom: 0; padding-bottom: 0; }
  .rq h3 { font: 700 1.02rem/1.3 var(--display); letter-spacing: -0.01em; margin: 0 0 14px; text-wrap: balance; }
  .row { margin-bottom: 13px; }
  .row:last-child { margin-bottom: 0; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: .95rem; }
  .row-top .pct { font: 700 1.05rem var(--display); font-variant-numeric: tabular-nums; flex: none; }
  .you {
    margin-left: 8px; padding: 2px 9px; border-radius: 999px;
    background: var(--orange-soft); color: var(--orange); border: 1px solid #f4c4a6;
    font: 700 .68rem var(--body); letter-spacing: .06em; text-transform: uppercase; vertical-align: 1px;
  }
  .track { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 6px; }
  .fill { height: 100%; width: 0; border-radius: 999px; background: var(--bar-other); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .row.top .fill { background: var(--navy); }
  .note { color: var(--muted); font-size: .85rem; margin: 22px 0 0; }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .fill, .option, .btn { transition: none; } }
</style>
</head>
<body>
<header class="hero">
  <svg class="court" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect x="20" y="20" width="560" height="260"/>
    <line x1="300" y1="20" x2="300" y2="280"/>
    <circle cx="300" cy="150" r="48"/>
    <rect x="20" y="95" width="150" height="110"/>
    <circle cx="170" cy="150" r="42"/>
    <rect x="430" y="95" width="150" height="110"/>
    <circle cx="430" cy="150" r="42"/>
  </svg>
  <div class="hero-in">
    <p class="eyebrow">Student survey</p>
    <h1 id="title"></h1>
    <p class="sub" id="intro"></p>
  </div>
</header>

<main>
  <section class="card" id="quiz" hidden>
    <div class="steps" id="steps" aria-hidden="true"></div>
    <div class="counter" id="counter"></div>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <div class="actions">
      <button class="btn" id="back" type="button">Back</button>
      <button class="btn primary" id="next" type="button" disabled>Next</button>
    </div>
    <div class="error" id="error" role="alert" hidden></div>
  </section>

  <section class="card" id="results" hidden>
    <div class="res-head">
      <h2>Results</h2>
      <span class="people" id="people"></span>
    </div>
    <div id="resultsList"></div>
    <p class="note" id="resultsNote"></p>
  </section>
</main>

<script>
/* ============================================================
   EDIT HERE: title, text, database and questions
   ============================================================ */
const CONFIG = {
  title: "School Survey",
  intro: "Six short questions about school life. When you finish, you will see how everyone answered.",

  /* Name of this survey in the database. Change it if you change the
     questions, so old answers do not get mixed with the new ones. */
  surveyId: "school-survey-1",

  /* Firebase Realtime Database URL, for example:
     "https://my-survey-default-rtdb.europe-west1.firebasedatabase.app"
     Empty = test mode (results only count this browser). */
  databaseUrl: ""
};

const QUESTIONS = [
  { text: "How do you go to school?",
    options: ["Car", "Public transport", "Walking", "Other"] },
  { text: "Do you eat at home?",
    options: ["Yes", "No", "Sometimes"] },
  { text: "How much time do you study?",
    options: ["30 minutes", "1 hour", "I don’t study", "Other"] },
  { text: "Do you like basketball?",
    options: ["Yes", "No"] },
  { text: "Do you like the food at school?",
    options: ["Yes", "No", "It depends"] },
  { text: "Do you like the teachers at school?",
    options: ["Yes", "No"] }
];

/* ============================================================
   App code (no need to change anything below)
   ============================================================ */
const $ = (id) => document.getElementById(id);
const LETTERS = "ABCDEFGH";
const LOCAL_KEY = "survey_local_" + CONFIG.surveyId;
let step = 0;
const answers = new Array(QUESTIONS.length).fill(null);

document.title = CONFIG.title;
$("title").textContent = CONFIG.title;
$("intro").textContent = CONFIG.intro;

function drawSteps() {
  const box = $("steps");
  box.textContent = "";
  QUESTIONS.forEach((_, i) => {
    const s = document.createElement("span");
    if (i < step) s.className = "done";
    else if (i === step) s.className = "now";
    box.appendChild(s);
  });
}

function showQuestion() {
  const q = QUESTIONS[step];
  drawSteps();
  $("counter").textContent = "Question " + (step + 1) + " of " + QUESTIONS.length;
  $("question").textContent = q.text;
  $("back").disabled = step === 0;
  $("next").textContent = step === QUESTIONS.length - 1 ? "Finish" : "Next";
  $("next").disabled = answers[step] === null;
  $("error").hidden = true;

  const box = $("options");
  box.textContent = "";
  q.options.forEach((label, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "option";
    b.setAttribute("aria-pressed", answers[step] === i ? "true" : "false");
    const k = document.createElement("span");
    k.className = "key";
    k.textContent = LETTERS[i];
    const t = document.createElement("span");
    t.textContent = label;
    b.appendChild(k);
    b.appendChild(t);
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });
}

function choose(i) {
  answers[step] = i;
  [...$("options").children].forEach((b, j) => {
    b.setAttribute("aria-pressed", j === i ? "true" : "false");
  });
  $("next").disabled = false;
}

document.addEventListener("keydown", (e) => {
  if ($("quiz").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  const i = LETTERS.indexOf(e.key.toUpperCase());
  if (e.key.length === 1 && i >= 0 && i < QUESTIONS[step].options.length) choose(i);
});

$("back").addEventListener("click", () => { if (step > 0) { step--; showQuestion(); } });

$("next").addEventListener("click", async () => {
  if (answers[step] === null) return;
  if (step < QUESTIONS.length - 1) { step++; showQuestion(); return; }
  $("next").disabled = true;
  $("next").textContent = "Sending...";
  try {
    await saveResponse(answers);
    showResults(await loadResponses());
  } catch (e) {
    $("error").textContent = "Your answers could not be sent. Check your connection and try again.";
    $("error").hidden = false;
    $("next").disabled = false;
    $("next").textContent = "Finish";
  }
});

/* ---------- storage ---------- */
function dbUrl() { return (CONFIG.databaseUrl || "").replace(/\/+$/, ""); }
function dbPath() { return dbUrl() + "/" + encodeURIComponent(CONFIG.surveyId) + ".json"; }

async function saveResponse(a) {
  if (dbUrl()) {
    const res = await fetch(dbPath(), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ a: a, t: Date.now() })
    });
    if (!res.ok) throw new Error("save failed");
    return;
  }
  const list = readLocal();
  list.push({ a: a, t: Date.now() });
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); } catch (e) {}
}

async function loadResponses() {
  if (dbUrl()) {
    const res = await fetch(dbPath());
    if (!res.ok) throw new Error("load failed");
    const data = await res.json();
    return data ? Object.values(data) : [];
  }
  return readLocal();
}

function readLocal() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch (e) { return []; }
}

/* ---------- results ---------- */
function showResults(all) {
  $("quiz").hidden = true;
  $("results").hidden = false;
  $("people").textContent = all.length + (all.length === 1 ? " response" : " responses");

  const list = $("resultsList");
  list.textContent = "";
  const fills = [];

  QUESTIONS.forEach((q, qi) => {
    const counts = new Array(q.options.length).fill(0);
    let total = 0;
    all.forEach((r) => {
      const v = r && Array.isArray(r.a) ? r.a[qi] : null;
      if (Number.isInteger(v) && v >= 0 && v < counts.length) { counts[v]++; total++; }
    });
    const max = Math.max.apply(null, counts);

    const wrap = document.createElement("div");
    wrap.className = "rq";
    const h = document.createElement("h3");
    h.textContent = (qi + 1) + ". " + q.text;
    wrap.appendChild(h);

    q.options.forEach((label, oi) => {
      const pct = total ? Math.round(counts[oi] / total * 100) : 0;
      const row = document.createElement("div");
      row.className = "row" + (total && counts[oi] === max ? " top" : "");

      const top = document.createElement("div");
      top.className = "row-top";
      const name = document.createElement("span");
      name.textContent = label;
      if (answers[qi] === oi) {
        const you = document.createElement("span");
        you.className = "you";
        you.textContent = "Your answer";
        name.appendChild(you);
      }
      const p = document.createElement("span");
      p.className = "pct";
      p.textContent = pct + "%";
      top.appendChild(name);
      top.appendChild(p);

      const track = document.createElement("div");
      track.className = "track";
      const fill = document.createElement("div");
      fill.className = "fill";
      track.appendChild(fill);
      fills.push([fill, pct]);

      row.appendChild(top);
      row.appendChild(track);
      wrap.appendChild(row);
    });
    list.appendChild(wrap);
  });

  requestAnimationFrame(() => requestAnimationFrame(() => {
    fills.forEach(([f, pct]) => { f.style.width = pct + "%"; });
  }));

  $("resultsNote").textContent = dbUrl()
    ? "Percentages include everyone who has completed the survey."
    : "Test mode: these results only include answers sent from this browser.";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("quiz").hidden = false;
showQuestion();
</script>
</body>
</html>
