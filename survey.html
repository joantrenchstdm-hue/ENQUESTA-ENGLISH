<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Survey</title>
<style>
  /* Layout: one centered column, one question per screen, results as horizontal bars. */
  :root {
    --bg: #f5f7f6;
    --card: #ffffff;
    --fg: #14221d;
    --muted: #5b6b64;
    --line: #d9e1dd;
    --accent: #0f7a5c;
    --accent-soft: #d7efe6;
    --accent-fg: #ffffff;
    --bar: #c9d6d0;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1714;
      --card: #17221e;
      --fg: #e8f0ec;
      --muted: #9fb0a8;
      --line: #2a3a34;
      --accent: #3ecf9f;
      --accent-soft: #19382e;
      --accent-fg: #06221a;
      --bar: #2c3d36;
      --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 48px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
  h2 { font-size: 1.25rem; line-height: 1.3; margin: 0 0 18px; text-wrap: balance; }
  p.intro { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
  }
  .progress { height: 6px; background: var(--bar); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .counter { color: var(--muted); font-size: .85rem; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  .options { display: grid; gap: 10px; }
  .option {
    display: block; width: 100%; text-align: left;
    background: var(--card); color: var(--fg);
    border: 1.5px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font: inherit; cursor: pointer;
  }
  .option:hover { border-color: var(--accent); }
  .option[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .option:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; gap: 10px; justify-content: space-between; margin-top: 22px; }
  .btn {
    font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 10px; padding: 10px 18px;
    border: 1.5px solid var(--line); background: transparent; color: var(--fg);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .result-q { margin-top: 26px; }
  .result-q:first-of-type { margin-top: 8px; }
  .result-q h3 { font-size: 1rem; margin: 0 0 10px; }
  .row { margin-bottom: 10px; }
  .row-top { display: flex; justify-content: space-between; gap: 12px; font-size: .95rem; }
  .row-top .pct { font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .track { height: 10px; background: var(--bar); border-radius: 999px; overflow: hidden; margin-top: 4px; }
  .fill { height: 100%; background: var(--muted); border-radius: 999px; }
  .row.mine .fill { background: var(--accent); }
  .tag {
    display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: .75rem; font-weight: 700;
  }
  .note { color: var(--muted); font-size: .85rem; margin-top: 18px; }
  .error { color: var(--danger); margin-top: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>

  <section class="card" id="quiz" hidden>
    <div class="progress"><div id="bar"></div></div>
    <div class="counter" id="counter"></div>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <div class="actions">
      <button class="btn" id="back" type="button">Back</button>
      <button class="btn primary" id="next" type="button" disabled>Next</button>
    </div>
    <div class="error" id="error" hidden></div>
  </section>

  <section class="card" id="results" hidden>
    <h2>Results</h2>
    <p class="intro" id="resultsIntro"></p>
    <div id="resultsList"></div>
    <p class="note" id="resultsNote"></p>
  </section>
</main>

<script>
/* ============================================================
   1) EDIT THIS: title, intro and questions (everything in English)
   ============================================================ */
const CONFIG = {
  title: "Quick Survey",
  intro: "Answer a few questions. At the end you will see what percentage of people chose each answer.",

  /* Paste your Firebase Realtime Database URL here to share results
     between everyone who opens the page, for example:
     "https://my-survey-default-rtdb.europe-west1.firebasedatabase.app"
     Leave it empty to test locally (results only count this browser). */
  databaseUrl: ""
};

const QUESTIONS = [
  { text: "Which problem affects you the most at school?",
    options: ["Too much homework", "Lack of time to study", "Noisy classrooms", "Difficulty understanding the subjects"] },
  { text: "How do you usually deal with that problem?",
    options: ["I ask a teacher", "I ask a classmate", "I look for it online", "I do nothing"] },
  { text: "How often does it happen?",
    options: ["Every day", "A few times a week", "A few times a month", "Rarely"] }
];

/* ============================================================
   2) App code (no need to change anything below)
   ============================================================ */
const $ = (id) => document.getElementById(id);
const LOCAL_KEY = "survey_local_responses_v1";
let step = 0;
const answers = new Array(QUESTIONS.length).fill(null);

$("title").textContent = CONFIG.title;
$("intro").textContent = CONFIG.intro;

function showQuestion() {
  const q = QUESTIONS[step];
  $("bar").style.width = (step / QUESTIONS.length * 100) + "%";
  $("counter").textContent = "Question " + (step + 1) + " of " + QUESTIONS.length;
  $("question").textContent = q.text;
  $("back").disabled = step === 0;
  $("next").textContent = step === QUESTIONS.length - 1 ? "Finish" : "Next";
  $("next").disabled = answers[step] === null;
  $("error").hidden = true;

  const box = $("options");
  box.textContent = "";
  q.options.forEach((label, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "option";
    b.textContent = label;
    b.setAttribute("aria-pressed", answers[step] === i ? "true" : "false");
    b.addEventListener("click", () => {
      answers[step] = i;
      showQuestion();
    });
    box.appendChild(b);
  });
}

$("back").addEventListener("click", () => { if (step > 0) { step--; showQuestion(); } });

$("next").addEventListener("click", async () => {
  if (answers[step] === null) return;
  if (step < QUESTIONS.length - 1) { step++; showQuestion(); return; }
  $("next").disabled = true;
  $("next").textContent = "Sending...";
  try {
    await saveResponse(answers);
    const all = await loadResponses();
    showResults(all);
  } catch (e) {
    $("error").textContent = "Could not send your answers. Check your connection and try again.";
    $("error").hidden = false;
    $("next").disabled = false;
    $("next").textContent = "Finish";
  }
});

/* ---------- storage ---------- */
function dbUrl() { return (CONFIG.databaseUrl || "").replace(/\/+$/, ""); }

async function saveResponse(a) {
  if (dbUrl()) {
    const res = await fetch(dbUrl() + "/responses.json", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ a: a, t: Date.now() })
    });
    if (!res.ok) throw new Error("save failed");
    return;
  }
  const list = readLocal();
  list.push({ a: a, t: Date.now() });
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); } catch (e) {}
}

async function loadResponses() {
  if (dbUrl()) {
    const res = await fetch(dbUrl() + "/responses.json");
    if (!res.ok) throw new Error("load failed");
    const data = await res.json();
    return data ? Object.values(data) : [];
  }
  return readLocal();
}

function readLocal() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch (e) { return []; }
}

/* ---------- results ---------- */
function showResults(all) {
  $("quiz").hidden = true;
  $("results").hidden = false;
  const people = all.length;
  $("resultsIntro").textContent = "Based on " + people + (people === 1 ? " person." : " people.");

  const list = $("resultsList");
  list.textContent = "";
  QUESTIONS.forEach((q, qi) => {
    const counts = new Array(q.options.length).fill(0);
    let total = 0;
    all.forEach((r) => {
      const v = r && Array.isArray(r.a) ? r.a[qi] : null;
      if (Number.isInteger(v) && v >= 0 && v < counts.length) { counts[v]++; total++; }
    });

    const wrap = document.createElement("div");
    wrap.className = "result-q";
    const h = document.createElement("h3");
    h.textContent = (qi + 1) + ". " + q.text;
    wrap.appendChild(h);

    q.options.forEach((label, oi) => {
      const pct = total ? Math.round(counts[oi] / total * 100) : 0;
      const row = document.createElement("div");
      row.className = "row" + (answers[qi] === oi ? " mine" : "");

      const top = document.createElement("div");
      top.className = "row-top";
      const name = document.createElement("span");
      name.textContent = label;
      if (answers[qi] === oi) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "Your answer";
        name.appendChild(tag);
      }
      const p = document.createElement("span");
      p.className = "pct";
      p.textContent = pct + "%";
      top.appendChild(name);
      top.appendChild(p);

      const track = document.createElement("div");
      track.className = "track";
      const fill = document.createElement("div");
      fill.className = "fill";
      fill.style.width = pct + "%";
      track.appendChild(fill);

      row.appendChild(top);
      row.appendChild(track);
      wrap.appendChild(row);
    });
    list.appendChild(wrap);
  });

  $("resultsNote").textContent = dbUrl()
    ? "Percentages include everyone who has completed the survey."
    : "Test mode: these results only include answers sent from this browser.";
}

$("quiz").hidden = false;
showQuestion();
</script>
</body>
</html>
